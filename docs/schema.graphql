scalar DateTime

type User {
  id: ID!
  email: String!
  username: String!
  confirmationCode: String
  confirmationCodeExpDate: DateTime
  isConfirmed: Boolean!
  displayName: String
  bio: String
  profilePictureFileId: ID
}

type UserOutput {
  id: String!
  email: String!
  username: String!
  isConfirmed: Boolean!
}

type Query {
  me: User!
  user(id: String!): User
  feed: [PostEntity!]!
  post(id: ID!): PostEntity
  profilePosts(input: ProfilePostsInput!): PostConnection!
}

type Mutation {
  signUp(input: SignUpInput!): SignUpPayload!
  emailConfirmation(input: EmailConfirmationInput!): EmailConfirmationPayload!
  emailConfirmationResending(input: ResendEmailInput!): EmailResendConfirmationPayload!
  signIn(input: SignInInput!): SignInPayload!
  logout: String!
  refreshToken: RefreshTokenPayload!
  passwordReset(input: PasswordResetInput!): PasswordResetPayload!
  setNewPassword(input: SetNewPasswordInput!): SetNewPasswordPayload!
  exchangeOAuthCode(input: OAuthExchangeCodeInput!): SignInPayload!
  initiateUploadBatch(input: [InitiateUploadInput!]!): [InitiateUploadPayload!]!
  completeUpload(input: [CompleteUploadInput!]!): [CompleteUploadPayload!]!
  createPost(input: CreatePostInput!): PostEntity!
  updatePostDescription(input: UpdatePostDescriptionInput!): PostEntity!
  deletePost(input: DeletePostInput!): Boolean!
}

enum Purpose {
  POST_IMAGE
  BILL
}

enum MimeType {
  JPEG
  PNG
}

enum FileStatus {
  PENDING
  UPLOADED
  READY
  FAILED
  DELETED
}

input SignUpInput {
  email: String!
  username: String!
  password: String!
  acceptTerms: Boolean!
  acceptPrivacy: Boolean!
}

input EmailConfirmationInput {
  code: String!
}

input ResendEmailInput {
  email: String!
}

input SignInInput {
  email: String!
  password: String!
}

input PasswordResetInput {
  email: String!
}

input SetNewPasswordInput {
  code: String!
  password: String!
}

input OAuthExchangeCodeInput {
  code: String!
}

input InitiateUploadInput {
  clientUploadId: String!
  originalName: String!
  purpose: Purpose!
  mimeType: MimeType!
  size: Int!
}

input CompleteUploadInput {
  fileId: String!
}

input CreatePostInput {
  fileIds: [ID!]!
  description: String
}

input UpdatePostDescriptionInput {
  postId: ID!
  description: String
}

input DeletePostInput {
  postId: ID!
}

input ProfilePostsInput {
  userId: ID!
  first: Int = 8
  after: String
}

type SignUpPayload {
  user: UserOutput!
  message: String!
}

type SignInPayload {
  user: User!
  accessToken: String!
}

type EmailConfirmationPayload {
  message: String!
}

type EmailResendConfirmationPayload {
  message: String!
}

type PasswordResetPayload {
  message: String!
}

type SetNewPasswordPayload {
  message: String!
}

type RefreshTokenPayload {
  accessToken: String!
  refreshToken: String!
}

type File {
  id: ID!
  ownerId: String!
  originalName: String!
  purpose: Purpose!
  mimeType: MimeType!
  size: Int!
  status: FileStatus!
  url: String
}

type InitiateUploadPayload {
  clientUploadId: String!
  fileId: String!
  uploadUrl: String!
  expiresAt: DateTime!
}

type CompleteUploadPayload {
  fileId: String!
  status: FileStatus!
}

type PostAttachmentEntity {
  id: ID!
  fileId: ID!
  order: Int!
  file: File
}

type PostEntity {
  id: ID!
  ownerId: String!
  description: String
  attachments: [PostAttachmentEntity!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PostEdge {
  cursor: String!
  node: PostEntity!
}

type PageInfo {
  startCursor: String
  endCursor: String
  hasNextPage: Boolean!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}
